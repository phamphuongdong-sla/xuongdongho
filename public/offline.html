<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mất Kết Nối - QL Kho SOWASUCO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; text-align: center; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; padding: 2.5rem 2rem; max-width: 440px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    .icon { width: 64px; height: 64px; background: #e0f2fe; color: #0284c7; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; font-size: 28px; }
    h1 { font-size: 1.35rem; font-weight: 700; color: #0f172a; margin-bottom: 0.75rem; }
    p { font-size: 0.925rem; color: #64748b; line-height: 1.5; margin-bottom: 1.75rem; }
    .btn { display: inline-block; background: #0284c7; color: white; padding: 0.75rem 1.75rem; border-radius: 0.75rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; font-size: 0.95rem; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
    .footer { margin-top: 1.5rem; font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>Đang Ngoại Tuyến (Offline)</h1>
    <p>Thiết bị của bạn hiện không có kết nối Internet. Vui lòng kiểm tra lại Wifi/4G hoặc thử tải lại trang khi mạng đã được kết nối.</p>
    <button class="btn" onclick="window.location.reload()">Thử Tải Lại</button>
    <div class="footer">Công ty Cổ phần Cấp nước Sơn La — SOWASUCO WM</div>
  </div>
</body>
</html>
