# Cloudflare Configuration for SOWASUCO Water Meter Management System (xuongdongho)
name = "xuongdongho"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "xuongdongho-db"
database_id = "" # Điền database_id sau khi chạy: npx wrangler d1 create xuongdongho-db
